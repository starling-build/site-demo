<noscript><main><h1>浙江省交通建设工程信用评价管理细则（长表格）</h1>
<p>浙江省交通建设工程从业主体</p>
<p>信用评价管理细则（试行）</p>
<p>	</p>
<p>为推进全省交通建设工程领域信用体系建设，构建权利平等、机会平等、规则平等的营商环境，根据《国务院办公厅关于加快推进社会信用体系建设构建以信用为基础的新型监管机制的指导意见》（国办发〔2019〕35号）和《国务院办公厅关于进一步完善失信约束制度构建诚信建设长效机制的指导意见》（国办发〔2020〕49号），以及《浙江省公共信用信息管理条例》等相关规定，按照“依法依规、公平公正、审慎适度、过惩相当”原则，结合我省实际，制定本细则。</p>
<p>一、适用范围</p>
<p>本细则适用于浙江省内公路水运建设工程设计、施工、监理、试验检测等从业单位和设计负责人、施工项目经理、施工技术负责人、施工安全负责人、总监理工程师、副总监理工程师、试验检测项目负责人、试验检测技术负责人等从业人员，以及由我省交通运输主管部门监管的地方铁路、城际轨道建设工程施工单位（以下简称“从业主体”）的信用信息采集、归集、共享、评价、应用等管理工作。</p>
<p>二、职责分工</p>
<p>（一）省级交通运输主管部门指导、监督全省交通建设工程信用评价管理工作，制定全省交通建设工程从业主体信用评价细则，组织开展全省交通建设工程从业主体信用评价工作，归集监督检查活动中产生的有关信用信息和省级其他监督部门提供的相关信用信息，认定、发布、应用全省交通建设工程从业主体的信用评价结果。</p>
<p>省公路与运输管理中心、省港航管理中心、省交通工程管理中心按照各自职责做好信用评价管理工作。</p>
<p>（二）市级交通运输（港航）主管部门指导、监督辖区内从业主体信用评价管理工作，负责辖区内新增项目基础信息和从业主体基础信息审核，归集监督检查活动中产生的有关信用信息和市级其他监督部门提供的相关信用信息，应用信用评价结果。</p>
<p>（三）县级交通运输主管部门负责辖区内从业主体信用评价管理工作，归集监督检查活动中产生的有关信用信息和县级其他监督部门提供的相关信用信息，应用信用评价结果。</p>
<p>（四）项目建设单位（实施机构）负责录入项目基础信息和从业主体基础信息，录入项目建设管理活动中产生的有关信用信息，应用信用评价结果。</p>
<p>三、信用信息主要内容</p>
<p>信用信息包括基础信息、不良信息和守信激励信息。</p>
<p>（一）基础信息主要包括：</p>
<p>浙江省内交通建设工程项目代码、工程概况、标段设置、合同金额、季度进展等项目基础信息；从业单位名称、资质等级、从业人员姓名、职务等从业主体基础信息。</p>
<p>（二）不良信息主要包括：</p>
<p>1.在法定期限内未提起行政复议、行政诉讼，或者经行政复议、行政诉讼最终维持原决定的行政处罚信息，但适用简易程序作出的除外；</p>
<p>2.经司法生效判决认定构成犯罪的信息；</p>
<p>3.不履行判决、裁定等生效法律文书的信息；</p>
<p>4.不履行行政决定而被依法行政强制执行的信息；</p>
<p>5.根据国家和省有关标准或者规定认定的严重失信名单信息；</p>
<p>6.行政检查、有关合同履行不良信息；</p>
<p>7.工程质量和生产安全事故相关不良信息；</p>
<p>8.其他依法依规认定的不良信息。</p>
<p>（三）守信激励信息主要包括：</p>
<p>抢险救灾和工程建设推进相关嘉奖、工程质量奖项、“平安百年品质工程”示范创建或示范冠名、认定和应用首台（套）设备、交通运输部平安工程冠名，以及其他省级以上表彰通报认定的激励信息。</p>
<p>四、评价范围</p>
<p>（一）常规评价项目及时间</p>
<p>评价项目：</p>
<p>1.公路建设项目主体工程（公路路基、路面、桥梁、隧道、交叉工程）合同价在2000万元及以上且项目概算总投资在1亿元及以上的施工标段，或合同价在5000万元及以上的施工标段；</p>
<p>2.公路建设项目交安设施和机电（通信、监控、收费、照明）等附属工程合同价在400万元及以上且项目概算总投资在1亿元及以上的施工标段；</p>
<p>3.水运建设项目合同价在400万元及以上且项目概算总投资在5000万元及以上的施工标段；</p>
<p>4.公路水运建设项目施工评价标段对应的所有设计和检测标段，施工评价标段对应的合同价在50万元及以上的监理标段；</p>
<p>5.各级交通运输主管部门监管的地方铁路、城际轨道建设工程的施工标段。</p>
<p>评价时间：</p>
<p>常规评价项目（标段）中，公路水运建设项目设计单位、施工单位、监理单位和相关从业人员的评价时段自监理签发开工令之日起，至交工验收或者中间交验合格之日止（机电工程自进入试运行后不再评价）；试验检测单位和相关从业人员的评价时段自合同签订之日起至检测项目注销之日止。地方铁路工程施工单位的评价时段自监理签发开工令之日起至初步验收通过之日止；城际轨道工程施工单位的评价时段自监理签发开工令之日起至项目工程质量验收通过之日止。评价年度内交通建设项目从业主体自监理签发开工令（合同签订）后连续履约时间应不少于3个月。公路水运建设项目从业主体在项目（标段）竣工验收前发生负面清单所列行为，按负面清单管理至执行期限结束。</p>
<p>因不可抗力等非自身原因暂停施工的常规评价项目（标段），若评价年度内连续履约时间不少于3个月，从业主体仍需参与当年度信用评价，由项目所在地设区市交通运输（港航）主管部门认定。</p>
<p>（二）负面清单评价项目</p>
<p>省内所有交通建设工程发生工程质量事故、生产安全事故、围标串标、非法转包、违法分包、业绩造假、行贿受贿、环境污染、恶意欠薪等方面被依法认定的不良信息的，均按信用评价负面清单进行动态管理（详见附件3、4、5）。</p>
<p>五、信用评价规则</p>
<p>（一）从业单位信用计分规则</p>
<p>从业单位信用评价得分包含基础信用分和信用附加分。基础信用分为99分，信用附加分最高为1分。</p>
<p>从业单位信用评价以项目标段为评价单元进行评分。单个评价标段的初始信用分为99分，信用附加分最高为1分。从业单位所有评价项目信用评分的加权平均值为该单位的基础信用分。计分规则详见附件1。</p>
<p>从业单位的信用附加分通过其在省内交通建设项目中的守信激励信息取得。附加分信息由从业单位报送项目所在地设区市交通运输（港航）主管部门，经设区市交通运输（港航）主管部门核实后录入省统建的信用交通系统（以下简称“系统”）。</p>
<p>从业单位信用评价具体标准见附件6、7。</p>
<p>（二）从业人员履约信用计分规则</p>
<p>从业人员履约信用评价以项目标段为评价单元进行评分。单个评价项目的初始信用分为99.5分，信用附加分最高为0.5分。按不良行为扣分标准累计扣分和附加分后，得到单个评价项目的信用得分。从业人员履约信用得分与从业单位的不良行为相关联，按责任分工进行扣分。设计负责人、施工项目经理、总监理工程师、副总监理工程师、试验检测项目负责人、试验检测技术负责人按从业单位评分标准的1倍计取，施工技术负责人、施工安全负责人按从业单位相对应评分标准的2倍计取。有多个评价项目的，从业人员信用得分按所有评价项目最低得分认定。</p>
<p>从业人员的信用评价具体标准见附件6。</p>
<p>（三）特别规定</p>
<p>1.招投标活动中，联合体投标单位发生负面清单所列投标行为的，联合体牵头人和责任成员方均纳入负面清单管理。</p>
<p>2.项目参建过程中，联合体牵头人发生负面清单所列不良行为的，纳入负面清单管理；对非直接责任成员方予以信用扣分，无责任成员方不予扣分。</p>
<p>联合体成员方发生负面清单所列不良行为的，纳入负面清单管理；对牵头人和非直接责任成员方予以信用扣分，无责任成员方不予扣分。</p>
<p>联合体牵头人或成员方发生附件6、7等其他不良行为的，仅对直接责任方予以信用扣分。</p>
<p>3.从业主体发生负面清单所列不良行为被动态调整后，有评价项目的仍需进行信用评分；得出的评价得分与动态调整结果相关联，最终信用等级不得高于动态调整后信用等级。</p>
<p>4.设计施工总承包（EPC）、全过程咨询、代建+监理等建设模式的从业主体，按设计、施工、监理、试验检测等类别分别评价。</p>
<p>5.施工分包单位的不良行为纳入项目（标段）施工总承包单位的信用评价。</p>
<p>六、信用等级</p>
<p>（一）信用等级划分</p>
<p>从业主体的信用等级分为AA、A、B、C、D五个等级。其中：设计、施工从业单位以不同资质分别参建不同项目（标段）时，按不同资质分别确定信用等级；监理、试验检测从业单位不分资质类型，按评价标段确定信用等级；从业人员按评价项目（标段）时任职岗位确定信用等级。</p>
<p>信用等级确定</p>
<p>综合评价得分X≥95且符合附件2所列条件之一，为AA级；评价得分95&gt;X≥85为A级；85&gt;X≥75为B级；75&gt;X≥60为C级；X&lt;60为D级。</p>
<p>（三）其他情形</p>
<p>1.从业主体评价得分95分及以上，但不符合附件2所列条件的或首次评价的，当前评价周期信用等级最高为A级，评价得分按94.9分确定；</p>
<p>2.从业主体上一评价周期为首次评价，且评价得分大于等于95分（信用等级为A级），其延用信用得分按94.9分确定；</p>
<p>3.从业主体上一评价周期信用评价等级为B级及以下的，当前评价周期信用等级最高为A级，评价得分大于等于90分的，按90分确定；</p>
<p>4.从业单位任一评价项目得分低于85分的，当期信用等级最高为A级，评价得分大于等于90分的，按90分确定；</p>
<p>5.从业单位有两个及以上评价项目的评价得分低于85分的，当期信用等级最高为B级，评价得分大于等于80分的，按80分确定；</p>
<p>6.从业单位发生负面清单所列行为，动态调整降为A级的，评价得分按90分确定。动态调整降为B级的，评价得分按80分确定。动态调整降为C级的，评价得分按67.5分确定。动态调整降为D级的，评价得分按30分确定；</p>
<p>7.从业主体在一个评价周期内发生一次负面清单所列行为动态调整执行期满后继续评价的，12个月内信用等级最高为A级，评价得分大于等于90分的，按90分确定；</p>
<p>8.从业主体在一个评价周期内发生两次及以上负面清单所列行为且动态调整至D级，执行期满后继续评价的，12个月内信用等级最高为B级，评价得分大于等于80分的，按80分确定。</p>
<p>信用等级确定后，从业单位更名或者资质升级的，当期信用等级不变。从业单位发生分立的，承继资质的从业单位信用等级按B级认定，但分立前原从业单位信用等级低于B级的，按分立前原从业单位信用等级确定。从业单位发生合并重组的，合并后从业单位的信用等级按合并前原各从业单位中的最低信用等级确定。</p>
<p>七、信用评价流程</p>
<p>（一）信息录入</p>
<p>从业主体的信用信息实时录入。与从业主体签订合同后，项目建设单位（实施机构）应在监理开工令签发（合同签订）一个月内录入项目基础信息和从业主体基础信息，对未及时录入的，相关交通运输（港航）主管部门和从业单位要催促建设单位及时录入，对延迟录入的项目建设单位（实施机构）给予通报。12月底前未录入项目基础信息和从业主体基础信息的不再参与本周期信用评价，并按负面清单进行动态管理。</p>
<p>各级交通运输（港航）主管部门及其所属的职能部门（以下统称“各级交通运输部门”）、项目建设单位（实施机构）根据职责分工，按照“谁检查、谁录入”的原则，根据评价标准，及时归集信用信息，并在7个工作日内通过系统及时录入。</p>
<p>从业主体可通过系统实时查询信息。从业主体对扣分有异议的，应于下个季度的第一个月的月底之前提出，逾期不予受理，异议时应提供有效的证明材料。对各级交通运输部门录入信息有异议的，向录入部门提出；对项目建设单位（实施机构）录入信息有异议的，向项目所在地设区市交通运输主管部门提出；原则上受理部门应在10个工作日内将处理结果告知异议主体；情况特别复杂的可适当延期至20个工作日。各级交通运输主管部门对录入信息异议的处理结果最终应当报省级交通运输主管部门审定。从业主体对异议处理结果不服的，可以向省级交通运输主管部门提出复核，原则上复核部门应在10个工作日内将复核结果告知从业主体；情况特别复杂的可适当延期至20个工作日。</p>
<p>（二）评价结果公示</p>
<p>省级交通运输主管部门每年3月底前通过系统向社会公示从业单位的信用评价结果，公示期10个工作日。公示期间从业单位对信用评价结果有异议的，向省级交通运输主管部门提出。省级交通运输主管部门原则上在10个工作日内将处理结果告知异议主体，情况特别复杂的可适当延期。</p>
<p>从业人员信用评价结果可通过系统查询。从业人员对信用结果有异议的，向省级交通运输主管部门提出。省级交通运输主管部门原则上在10个工作日内将处理结果告知异议主体，情况特别复杂的可适当延期。</p>
<p>（三）评价结果发布</p>
<p>从业主体的信用年度评价结果实行年度发布、负面清单动态调整，年度信用评价结果在下一年的4月底前发布。评价结果确定后，从业主体不再有评价项目的，原信用等级（分数）延续1个周期。</p>
<p>从业单位的评价结果通过“浙江交通”网站向社会公开发布，也可通过系统查询并打印。</p>
<p>从业人员的信用等级通过系统发布，从业人员所在单位及其本人可通过系统查询并打印相关信用等级情况。</p>
<p>八、举报处理</p>
<p>任何单位和个人可对从业主体的不良行为向有关交通运输（港航）主管部门进行实名举报。受理部门原则上在60日内完成对举报事项的调查处理，并将处理结果告知举报人，情况特别复杂的，可适当延期，延长时间不超过30日，非受理部门原因导致调查中止的除外。</p>
<p>举报事项在未完成调查处理之前，不影响信用评价的正常进行。</p>
<p>九、信用评价结果应用</p>
<p>对于信用等级为AA、A级的从业主体，招标人可在招投标活动中给予一定的激励；对于信用等级为C、D级的从业主体，招标人可在招投标活动中给予一定的约束，各级交通运输部门和项目建设单位要对其履约行为进行重点监管。</p>
<p>十、保障措施</p>
<p>（一）明确信用评价项目检查要求。各级交通运输部门要高度重视，强化工程质量、安全、合同履约的监督检查工作。县级每季度不少于一次辖区内评价项目（标段）检查全覆盖；市级每半年不少于一次辖区内评价项目（标段）检查全覆盖；省级每年不少于一次重大项目（标段）检查全覆盖，并按一定比例抽查其他评价项目。各级交通运输部门可按照“综合查一次”原则，联合开展检查。检查中发现的问题按照附件8进行填写。对上一评价周期内发生负面清单行为的从业单位应加强动态监管，实行差异化管理。项目建设单位（实施机构）要强化项目管理，按照有关制度落实检查职责。</p>
<p>（二）确保信用评价工作质量。各级交通运输部门、建设单位（实施机构）要加强对工作人员的培训，切实抓好本细则和评价标准的宣贯实施，确保工作人员熟练掌握相关要求，严格按照“应评尽评、应录尽录”原则，及时准确录入评价信息。</p>
<p>（三）严格信用评价工作纪律。各级交通运输部门、建设单位（实施机构）按照职责做好相关工作，依法依规严格规范信用信息采集、共享、公开范围，严格规范失信惩戒和信用修复工作，确保交通建设工程信用评价工作在法治轨道运行。上级交通运输（港航）主管部门要加强检查，发现下级部门、建设单位（实施机构）未履职或履职不到位的，应责令整改。</p>
<p>十一、负面清单和计分规则等附件将根据情况进行动态调整。</p>
<p>十二、本细则自2024年6月1日起施行，《浙江省公路水运建设工程从业主体信用评价管理细则（试行）》（浙交〔2022〕68号）、《地方铁路与城际轨道施工企业信用评价管理规定（试行）》（浙交〔2021〕85号）同时废止。</p>

<p>6.从业单位因某评价项目发生负面清单所列不良行为，信用等级被降级后，仍需进行信用评分。信用等级调整后直至降级执行期限结束，涉及降级事项的评价项目起评分按降级后等级的中间分值取值（A为90分、B为80分、C为70分、D为30分），其他评价项目按原标准继续评价，得出的综合评价得分与降级后等级进行比较，不得超过负面清单确认的信用等级。</p>
<p>7.失信行为的认定时间自不良行为或者事件认定之日起计算。</p>
<p>8.检测单位的项目评价单元为：竣（交）工检测、现场专项检测（包括桩基检测、桥梁荷载试验、软基施工监测、桥梁施工监测、隧道施工监测、高边坡监测、基坑开挖监测等）设立的中心试验室或工地试验室。施工、监理单位工地试验室行为纳入施工、监理单位信用评价。</p>
<p>9.发生以下四种情形导致从业人员未按投标承诺到位或被替换的，不进行扣分：（1）投标截止期后90天，双方未签订合同，或虽签订了合同，但工程不具备开工条件且建设单位未按合同规定支付费用的；（2）因故连续停工超过90天且建设单位未按合同规定支付费用的；（3）从业人员突发重大疾病或伤亡无法履职(出具三甲医院证明)；（4）从业人员到达法定退休年龄退休的。</p>
<p>10.勘察、设计分开招投标的，勘察期间发现的问题不录入设计单位信用信息。</p>
<p>11.跨地区的项目，由相关地市委托其中一地负责评价工作，或者按标段所在地区分别由所在地市负责评价。</p>
<p>12.机电工程自进入试运行期后（监理签发的机械完工证书中注明的时间开始计算）不再评价，发生负面清单情况除外。</p>
<p>13.行政处罚涉及到认定标准中其他具体失信行为时，原则上不重复扣分，应按“就高不就低”原则进行扣分。</p>
<p>14.六项制度指确保农民工工资保证金、农民工工资专用专户管理、银行代发工资、农民工实名制管理、按月足额支付工资、施工现场维权信息公示等。</p>
<p>15.行政处罚分为下列三类情形：重大案件是指罚没10万元以上的处罚；一般案件是指罚没不超过10万元的处罚；较轻案件是指普通程序的警告、通报批评的处罚。</p>
<p>16.JC17与试验检测项目负责人无关的不扣其信用分。</p>
<p>17.检测母体机构对工程项目的检查频率每半年不少于一次。</p>
<p>18.施工单位内部工地试验室合同额按施工合同额的1%计算，监理单位内部工地试验室按监理合同额20%计算。</p>
<p>19.试验检测报告含正式报告和简报。</p>
<p>20.试验检测项目负责人包括施工、监理工地试验室的试验室主任。</p>

<p>3.抢险救灾等应急事件在从业单位综合评分中加分，最多加0.5分；</p>
<p>4.工程建设推进在项目（标段）评分中加分，最多加0.5分。</p>
<p>28</p>
<p>TLSG28</p>
<p>列入“平安百年品质工程”示范创建或示范冠名项目</p>
<p>评价年度内，评价项目或曾经评价项目被列入“平安百年品质工程”示范创建(加标段)或示范冠名（加总分）。</p>
<p>国家级：加0.5分/项；省级：加0.2分/项</p>
<p>1.信用附加分自相关证明文件发布之日起算；</p>
<p>2.同一从业单位在同一项目中获奖的，1个评价周期加分项只允许使用一次，分值可在奖项层级提高后做相应调整；</p>
<p>3.被列入“平安百年品质工程”示范创建或示范冠名项目从业单位需有创建内容和创建任务，国家级、省级表彰由省级交通主管部门认定；</p>
<p>4.示范创建加分在单个项目（标段）评分中，最多加0.5分；示范冠名加分在从业单位综合评分中，最多加0.5分。</p>
<p>29</p>
<p>TLSG29</p>
<p>认定、应用首台（套）设备</p>
<p>1.评价年度内，设计单位在评价标段中使用首台（套）设备，且使用的首台（套）设备须在评价年度内购买；</p>
<p>2.评价年度内，有被认定为首台（套）装备的企业，按国际、国内两个档次。</p>
<p>第1项：首台（套）设备金额每满100万元加0.1分，最高加0.5分；第2项：国际：加0.2分；国内：加0.1分</p>
<p>第1项：</p>
<p>1.根据《浙江省经济和信息化厅浙江省交通运输厅关于推动综合交通装备首台（套）突破的实施意见》（浙经信装备〔2023〕254号）和《浙江省交通运输厅浙江省经济和信息化厅关于做好综合交通首台（套）装备推广应用工作的通知》（浙交函〔2024〕19号），施工单位购买目录中的首台（套）设备予以加分；</p>
<p>2.首台套采购认定标准，应同时满足以下4个条件：①签订合同；②送货单或自提单；③对应设备物资采购或租赁发票，分包单位采购或租赁首台（套）装备和总包单位一样有效；④转账付款凭证；</p>
<p>3.信用附加分为评价年度内，单个项目（标段）所购首台（套）设备金额总和；</p>
<p>4.在单个项目（标段）评分中加分；</p>
<p>5.由项目所在设区市级交通运输主管部门认定。</p>
<p>第2项：</p>
<p>1.信用附加分自相关证明文件发布之日起算；</p>
<p>2.在从业单位综合评分中加分，最多加0.2分。</p>
<p>30</p>
<p>TLSG30</p>
<p>项目获得质量奖项</p>
<p>评价年度内，省内地方铁路与城际轨道评价项目或曾经评价项目获得国家或省级奖项：国家级奖项指国家优质工程奖、李春奖、鲁班奖、詹天佑奖；省级奖项指钱江杯。</p>
<p>国家级：加0.5分/项；省级：加0.2分/项</p>
<p>1.信用附加分自相关证明文件发布之日起算；</p>
<p>2.同一施工单位在同一项目中获奖的，1个评价周期内加分项只允许使用一次，分值可在奖项层级提高后做相应调整；</p>
<p>3.在从业单位综合评分中加分，最多加0.5分。</p>
<p>备注：1.企业信用行为评定工作具体在信用交通系统中开展。</p>
<p>2.评价项目是指具有项目赋码的地方铁路与城际轨道建设工程项目。</p>
<p>3.评价周期内交验或合同终止的项目（标段），其施工单位的评价等级按照评价时段最后一日的评价得分确定。</p>
<p>4.除以项次扣分的行为外，一种行为在单个合同段的同次检查中原则上不重复扣分，应按“就高不就低”原则进行扣分。</p>
<p>5.各级交通运输部门、建设（代建）单位在检查中发现施工单位存在失信行为，依据标准进行相应扣分，并要求施工单位在一定时限内整改，</p>
<p>整改期内不重复扣分。整改期后，相关部门在检查过程中仍发现同一失信行为或原问题仍未整改到位，按照标准继续扣分。</p>
<p>6.施工单位因某评价项目发生负面清单所列不良行为，信用等级被降级后，仍需进行信用评分。信用等级调整后直至降级执行期限结束，涉及降级事项的评价项目起评分按降级后等级的中间分值取值（A为90分、B为80分、C为70分、D为30分），其他评价项目按原标准继续评价，得出的综合评价得分与降级后等级进行比较，不得超过负面清单确认的信用等级。</p>
<p>7.失信行为或优信行为的认定时间自不良行为或事件的认定之日起计算。</p>
<p>8.跨地区的项目，按标段所在地区分别由所在地市负责评价。</p>
<p>9.行政处罚分为下列三类情形：重大案件是指罚没10万元以上的处罚；一般案件是指罚没不超过10万元的处罚；较轻案件是指普通程序的警告、通报批评的处罚。</p>

<canvas id="starling"></canvas>
<div id="loading"><div><div id="loading-text">Loading…</div><div class="bar"><div id="loading-fill" class="indeterminate"></div></div></div></div>
<div id="font-status" role="status" hidden><span></span><button type="button" hidden>Retry</button></div>
<script type="module">
  // A trap inside a frame or an event handler surfaces here, not in the
  // promise below; without the stack it is only 'unreachable'.
  window.addEventListener('error', (event) => {
    console.error(String(event.error?.stack || event.message));
  });
  import { startStarling } from './starling.js';
  const fontStatus = document.getElementById('font-status');
  const retryFonts = fontStatus.querySelector('button');
  retryFonts.addEventListener('click', () => window.starling?.retryFonts().catch(console.error));
  startStarling({
    canvas: document.getElementById('starling'),
    app: 'app.wasm',
    // The app's command line (Office: ['--slides'] starts in Slides).
    args: ['--site', '/site-demo/'],
    // The tab's URL path is the app's route (the wiki opens the page it names).
    initialRoute: location.pathname + location.search + location.hash,
    skwasmBase: 'skwasm/',
    // Written by build/web-app.sh; the first face is also the fallback
    // for any family nobody loaded.
    fonts: 'fonts/manifest.json',
    onFontStatus({ pending, failed }) {
      fontStatus.hidden = !pending.length && !failed.length;
      fontStatus.querySelector('span').textContent = failed.length
        ? 'Some fonts could not load. Text is using a fallback.' : 'Loading document fonts…';
      retryFonts.hidden = !failed.length;
    },
    onPhase(message) {
      document.getElementById('loading-text').textContent = message;
      document.getElementById('loading-fill').classList.add('indeterminate');
    },
    onProgress(loaded, total) {
      const fill = document.getElementById('loading-fill');
      fill.classList.toggle('indeterminate', !total);
      if (total) fill.style.width = `${Math.min(100, 100 * loaded / total)}%`;
    },
  }).then((starling) => {
    window.starling = starling;
    // A shell page made for a route (the wiki's server, a site build)
    // already carries the page's title; keep it.
    if (!document.querySelector('meta[name="starling-route"]')) document.title = 'Starling — running';
    const loading = document.getElementById('loading');
    // The first frame is on screen a beat after start returns.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      loading.classList.add('done');
      setTimeout(() => loading.remove(), 400);
    }));
  })
    .catch((error) => {
      console.error(String(error.stack || error));
      document.title = 'Starling — failed';
      document.body.append(Object.assign(document.createElement('pre'), {
        textContent: String(error.stack || error),
        style: 'color:#ef5350;padding:16px;white-space:pre-wrap',
      }));
    });
</script>
