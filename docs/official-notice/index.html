<noscript><main><h1>临沧市政府办公室通知（公文格式）</h1>
<p>临沧市人民政府办公室关于印发临沧市政府</p>
<p>向社会力量购买服务实施意见的通知</p>
<p>临政办发〔2016〕120号</p>
<p>各县、自治县、区人民政府，市直各委、办、局：</p>
<p>《临沧市政府向社会力量购买服务实施意见》已经市人民政府研究同意，现印发给你们，请认真贯彻实施。</p>
<p>临沧市人民政府办公室      </p>
<p>2016年8月1日        </p>
<p>（此件公开发布）</p>
<p>临沧市政府向社会力量购买服务实施意见</p>
<p>为进一步深化行政管理体制改革，加快转变政府职能，完善公共财政体系，提高公共服务的质量和效率，根据《云南省人民政府办公厅关于政府向社会力量购买服务的实施意见》（云政办发〔2015〕62号）文件等相关规定，结合我市实际，制定本实施意见。</p>
<p>一、准确把握政府购买服务总体要求</p>
<p>（一）指导思想</p>
<p>以邓小平理论、“三个代表”重要思想、科学发展观为指导，深入贯彻落实党的十八大、十八届三中全会和习近平总书记系列重要讲话精神，按照加快政府职能转变，深化财税体制改革，提高公共服务供给水平的要求，改革创新公共服务提供机制和方式，整合各级各类资源，放开公共服务市场准入，激发社会力量参与活力，建立健全公共服务市场化、多元化和社会化供给机制，努力为人民群众提供更加方便、快捷、优质、高效的公共服务。</p>
<p>（二）基本原则</p>
<p>1．试点先行，逐步推进。根据全市经济社会发展需要、政府职能转变、财政管理要求，合理界定政府购买服务的范围和项目，妥善处理与原有公共服务供给方式的衔接，逐步引导社会力量参与，积极稳妥推进政府向社会力量购买服务。</p>
<p>2．权责明确，确保质量。按照事权与支出责任相适应的原则，健全法规制度，明确部门职责，完善工作机制，强化监督管理，形成符合实际、协调有力、规范高效的政府购买服务制度，推进政府购买服务健康发展。</p>
<p>3．竞争择优，公开透明。按照公开、公平、公正原则，通过竞争择优方式选择政府购买服务的承接主体，确保具备条件的社会力量平等参与竞争。</p>
<p>4．强化监督，注重实效。探索建立多方参与政府购买服务的监管方式，加强政府购买服务的绩效管理，提高公共服务质量，不断提升政府购买服务的社会效益和经济效益。</p>
<p>5．厉行节约，控制成本。坚持以事定费、费随事转，防止一边购买服务、一边养人办事，厉行节约，降低服务成本。</p>
<p>（三）目标任务</p>
<p>到2018年，初步形成统一有效的购买服务平台、工作机制和监督评审机制，购买服务范围要覆盖到大部分适宜向社会力量购买的基本公共服务、社会管理服务以及事务性管理服务领域。到2020年，全市基本建立起比较完善的政府购买服务制度，公共服务水平和质量显著提升。</p>
<p>二、建立健全政府购买服务机制</p>
<p>（四）明确购买服务主体</p>
<p>政府购买服务主体(以下简称购买主体)是各级党政机关及其直属机构、人大、政协、法院、检察院、社会团体等机关和参照公务员法管理的事业单位。</p>
<p>购买主体负责研究制定本行业本系统购买服务实施细则，提出合理需求和条件；依照有关程序和方式实施购买，对承接主体提供的服务进行监督管理，在项目完成后组织考核评估和验收。按规定公开政府购买服务相关信息，自觉接受社会监督。</p>
<p>（五）确定承接主体资格</p>
<p>承接政府购买服务主体(以下简称承接主体)，包括依法在民政部门登记成立或经国务院批准免予登记的社会组织，按照事业单位分类改革划入公益二类或转为企业的事业单位，依法在工商行政管理或行业主管部门登记成立的企业、机构等社会力量。承接主体应具备以下条件：</p>
<p>1．依法登记设立，具有独立承担民事责任的能力。</p>
<p>2．治理结构健全，内部管理和监督制度完善。</p>
<p>3．具有独立的财务管理制度、会计核算和资产管理制度。</p>
<p>4．具备提供公共服务所必需的设施、人员和专业技术能力。</p>
<p>5．行业管理部门有具体专业资质要求的，应具备相应资质要求。</p>
<p>6．具有依法缴纳税收和社会保险费用的良好记录。</p>
<p>7．在参与政府购买服务竞争前通过年检、资质审查合格，社会信誉、商业信誉良好。</p>
<p>8．法律法规规定以及购买服务项目要求的其他条件。</p>
<p>承接主体的其他条件由购买主体根据购买服务项目的性质和质量要求确定。购买主体应当保障各类承接主体平等竞争，不得以不合理的条件对承接主体实行歧视性限制。</p>
<p>（六）科学界定购买内容</p>
<p>政府购买服务的内容为适合采取市场化方式提供、社会力量能够承担的公共服务及辅助性服务，突出公共性、公益性和辅助性。除应当由政府直接提供、法律法规另有规定或涉及国家安全、保密事项以及司法审判、行政行为等不适合向社会力量购买，以及不属于政府职责范围的服务项目外，下列基本公共服务和非基本公共服务事项可通过政府购买服务的方式，逐步交由社会力量承担：</p>
<p>1．基本公共服务事项。基本公共教育、科技服务、劳动就业服务、人才服务、社会保险、社会救助、社会福利、基本养老服务、优扶安置服务、基本医疗卫生、人口和计划生育服务、基本住房保障、公共文化、公共体育、基本公共安全服务、残疾人基本公共服务、环境保护、交通运输、服务“三农”等领域适合由社会力量承担的基本公共服务事项；</p>
<p>2．社会管理服务事项。区划地名管理、社会组织管理、社区事务、养老服务、社工服务、法律援助、扶贫救灾、慈善救济、公益服务、人民调解、社区矫正、安置帮教、公共公益宣传培训、民族团结和边疆稳定等领域适合由社会力量承担的公共服务事项；</p>
<p>3．行业管理与协调事项。行业职业资格认定、处理行业投诉等领域适合由社会力量承担的公共服务事项。</p>
<p>4．技术服务事项。科研、行业规划、行业规范、行业调查、行业统计分析、资产评估、检验检疫检测、监测服务等领域适合由社会力量承担的公共服务事项；</p>
<p>5．政府履职所需辅助性事项。法律服务、课题研究、政策调研、政策草拟、决策论证、统计调查、监督评估、绩效评价、材料整理、工程服务、项目评审、技术业务培训、会展服务、编制规划、规划评估、税务咨询、审计服务、后勤服务和网络管理等领域适合由社会力量承担的公共服务事项；</p>
<p>6．政府新增的或临时性、阶段性的公共服务事项，以及其他适合由社会力量承担的公共服务事项。</p>
<p>全市政府购买服务指导目录由市财政局牵头研究制定，并根据经济社会发展变化、政府职能转变及公众需求等情况及时对目录进行动态调整。对应当由政府直接提供、不适合社会力量承担的公共服务，以及不属于政府职责范围的服务项目，购买主体不得向社会力量购买。纳入指导目录的服务事项，应当实施购买服务。</p>
<p>（七）规范购买操作流程</p>
<p>1．编制购买计划。购买主体根据本级政府购买服务指导目录，结合同级党委、政府工作部署以及部门预算安排、本单位工作实际等因素，原则上在年度部门预算资金范围内，编制年度购买服务项目计划，随同部门预算一起报同级财政部门审核。</p>
<p>2．公示购买信息。购买服务项目计划经同级财政部门审核并出具明确意见后，向社会公开所需购买服务项目的预算资金、主要内容、承接标准和目标要求等信息。</p>
<p>3．确定购买方式。购买主体应根据购买内容的市场发育程度、服务提供方式和特点等因素，按照“方式灵活、程序简便”的原则组织购买。</p>
<p>对符合政府采购条件的，按照《中华人民共和国政府采购法》等相关规定，遵循政府采购管理的程序和方式组织实施，统一纳入采购程序，通过公开招标、邀请招标、竞争性谈判、单一来源、询价、竞争性磋商等采购方式确定承接主体，达到公开招标限额标准以上的服务项目，应当进入公共资源交易中心交易。</p>
<p>对具有特殊性、不符合竞争性条件（承接主体发育程度低）的购买事项，可采取特许经营、委托、战略合作、大额项目分包、新增项目另授等方式实施购买，积极探索定额补助、以奖代补等形式，并报同级财政部门审核确定。</p>
<p>4．签订购买合同。承接主体与购买方式确定后，购买主体应及时与承接主体签订购买服务合同，明确购买服务的范围、标的、数量、质量要求以及服务期限、资金支付方式、权利义务、违约责任和解决争议的方法等内容。购买主体要将合同等相关材料报同级财政部门备案。购买主体应当加强购买合同管理，督促承接主体严格履行合同，及时了解掌握购买项目实施进度，严格按照国库集中支付管理有关规定和合同执行进度支付款项，并根据实际需求和合同规定积极帮助承接主体做好与相关政府部门、服务对象的沟通、协调。承接主体应当按合同履行提供服务的义务，认真组织实施服务项目，按时完成服务项目任务，保证服务数量、质量和效果，主动接受有关部门、服务对象及社会监督，严禁转包行为。</p>
<p>5．合同验收结算。承接主体完成合同约定的服务事项后，购买主体要按照购买合同规定的服务标准组织履约验收，验收合格的，应将政府采购合同等相关材料送同级财政部门，按照采购资金管理相关支付流程，通过国库集中支付程序支付，并将执行情况纳入部门预算考核。</p>
<p>（八）强化项目监督管理</p>
<p>1．加强预算管理。购买主体购买服务所需资金，从部门预算经费或经批准的专项资金等既有预算中统筹安排，并通过资源整合，扩大购买资金来源。有机衔接政府购买服务资金预算与年度部门预算、政府采购预算。财政部门在布置年度预算编制工作时，应当对购买服务相关预算安排提出明确要求，在预算报表中制定专门的购买服务项目表。财政部门对政府购买服务项目表进行审核后，随部门预算批复同时下达给相关购买主体。购买主体应当按照财政部门下达的购买服务项目表，组织实施购买服务工作。重大项目、重大民生事项或政府因工作需要临时确定的重要事项，按照财政专项资金管理规定和“一事一议”原则，专项研究确定购买服务资金规模和来源。建立预算执行动态监控机制，为防范和控制财政资金支付风险，将购买主体服务资金的使用情况纳入预算执行动态监控，保证财政资金安全规范有效使用。</p>
<p>2．加强绩效管理。购买主体应会同财政部门，围绕购买服务流程、专业方法、质量控制、监督管理、需求评估、成本核算、招投标管理和能力建设等环节，做好相关标准研究制定，逐步建立科学合理、协调配套的绩效评价指标体系。将政府购买服务资金纳入财政资金绩效管理体系，建立绩效评价办法，探索建立由购买主体、服务对象及第三方组成的综合性评价机制，对购买服务项目数量、质量和资金使用绩效等进行考核评价。评价结果向社会公布，并作为以后年度编制政府购买服务预算和选择承接主体的重要依据。</p>
<p>3．加强对承接主体的规范管理。承接主体应当建立政府购买服务台账，记录相关文件、工作计划方案、项目和资金批复、项目进展和资金支付、工作汇报总结、重大活动和其他有关资料信息，接受和配合相关部门对资金使用情况进行监督检查及绩效评价；应当建立健全财务制度，严格遵守相关财政财务规定，对购买服务的项目资金进行规范的财务管理和会计核算，加强自身监督，确保资金规范管理和使用；应当建立健全财务报告制度，按照要求向购买主体提供资金的使用情况、项目执行情况、成果总结等材料。</p>
<p>4．加强过程监管和信息公开。充分利用和整合现有政府网络平台资源，建立集政策咨询、申报审批、日常监督、信息服务于一体，内容全面、方便快捷的政府购买服务平台。及时发布政府购买服务有关政策制度、购买目录、承接主体条件、采购结果、绩效评价结果等信息。购买主体应全面全程公开购买服务的有关信息，做到信息透明化，主动接受财政、审计等部门的监督及社会监督。</p>
<p>三、加强政府购买服务的保障与监督</p>
<p>（九）加强组织领导</p>
<p>各县（区）人民政府对本级政府向社会力量购买服务工作负总责，要把政府向社会力量购买服务工作列入重点改革任务，纳入各级、各部门的目标管理，并作为督查重点。要建立政府购买服务工作联席会议制度。要制定完善政策措施和实施办法，并抄送上一级政府财政部门。要按照“事权与支出责任相适应”的原则，将向社会力量购买服务的资金纳入同级财政预算和财政资金绩效管理体系。</p>
<p>（十）健全工作机制</p>
<p>建立“政府领导，财政牵头，机构编制、民政、工商、发展改革以及行业主管部门协同，职能部门履职，监督部门保障”的工作机制，做到各负其责、齐抓共管。</p>
<p>财政部门牵头负责建立健全政府购买服务制度，制定政府向社会力量购买服务指导目录，监督、指导各类购买主体依法开展购买服务工作，做好政府购买服务的采购管理、资金管理、监督检查和绩效评价等工作；在政府及财政现有公开网站基础上，牵头建立政府购买服务统一信息发布平台及购买服务项目管理系统。</p>
<p>民政、工商行政管理以及行业主管等部门要按照职责分工，培养和壮大社会力量，负责向购买主体提供相关名录，协助购买主体对承接主体所应具备的资质和相关条件进行核实，并将承接主体参与购买服务的情况纳入年检、评估和执法等监管体系，建立相应的信用记录和应用制度。</p>
<p>机构编制部门负责推进政府职能转变，按照事业单位改革的要求推进有条件的事业单位转为企业和社会组织，探索研究提出通过购买服务方式促进事业单位分类改革的意见和措施；要分期分批制定政府转移职能目录，参与政府购买服务绩效评价。</p>
<p>发展改革部门负责会同有关部门编制和实施政府投资计划，推动政府投资项目中的有关服务内容列入政府购买服务计划。</p>
<p>审计部门负责对政府购买服务工作和资金使用情况进行监督、审计，并参与政府购买服务绩效评价。</p>
<p>各职能部门作为具体组织实施单位，必须严格按照相关要求，落实年度购买计划，制定本部门或本行业的政府购买服务具体方案，并主动公开相关信息，接受监督。</p>
<p>（十一）严格监督管理</p>
<p>财政、审计、监察等部门应加强对政府购买服务的监督，确保政府购买服务资金规范管理和使用。应加强对购买主体的日常监管，不得将应由政府承担的公共服务擅自改由政府向社会力量购买，对不按照规定使用资金或未按合同完成购买服务工作量的购买主体，财政不再拨付下一年度购买经费；对违法违规行为，按照规定予以处罚、处分或移交司法机关处理。建立退出机制和择优机制，对弄虚作假、冒领财政资金的承接主体，依法给予行政处罚，3年内不得介入政府购买服务；对在政府购买服务工作中作出突出贡献、取得良好社会和经济效益的社会力量，可成为下年度购买服务计划项目的优先选择主体。</p>
<p>（十二）强化宣传引导</p>
<p>市直有关部门和各县（区）人民政府要广泛宣传政府向社会力量购买服务的重大意义，做好政策解读，塑造工作典型，加强舆论引导，深入开展社会调查，主动回应群众关切，充分调动社会参与的积极性。同时，严格按照规定，做好政府向社会力量购买服务的有关政策和实施过程的信息公开，接受社会监督。</p>

<script type="module">
  // A trap inside a frame or an event handler surfaces here, not in the
  // promise below; without the stack it is only 'unreachable'.
  window.addEventListener('error', (event) => {
    console.error(String(event.error?.stack || event.message));
  });
  import { startStarling } from './starling.js';
  const fontStatus = document.getElementById('font-status');
  const retryFonts = fontStatus.querySelector('button');
  retryFonts.addEventListener('click', () => window.starling?.retryFonts().catch(console.error));
  startStarling({
    canvas: document.getElementById('starling'),
    app: 'app.wasm',
    // The app's command line (Office: ['--slides'] starts in Slides).
    args: ['--site', '/site-demo/'],
    // The tab's URL path is the app's route (the wiki opens the page it names).
    initialRoute: location.pathname + location.search + location.hash,
    skwasmBase: 'skwasm/',
    // Written by build/web-app.sh; the first face is also the fallback
    // for any family nobody loaded.
    fonts: 'fonts/manifest.json',
    onFontStatus({ pending, failed }) {
      fontStatus.hidden = !pending.length && !failed.length;
      fontStatus.querySelector('span').textContent = failed.length
        ? 'Some fonts could not load. Text is using a fallback.' : 'Loading document fonts…';
      retryFonts.hidden = !failed.length;
    },
    onPhase(message) {
      document.getElementById('loading-text').textContent = message;
      document.getElementById('loading-fill').classList.add('indeterminate');
    },
    onProgress(loaded, total) {
      const fill = document.getElementById('loading-fill');
      fill.classList.toggle('indeterminate', !total);
      if (total) fill.style.width = `${Math.min(100, 100 * loaded / total)}%`;
    },
  }).then((starling) => {
    window.starling = starling;
    // A shell page made for a route (the wiki's server, a site build)
    // already carries the page's title; keep it.
    if (!document.querySelector('meta[name="starling-route"]')) document.title = 'Starling — running';
    const loading = document.getElementById('loading');
    // The first frame is on screen a beat after start returns.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      loading.classList.add('done');
      setTimeout(() => loading.remove(), 400);
    }));
  })
    .catch((error) => {
      console.error(String(error.stack || error));
      document.title = 'Starling — failed';
      document.body.append(Object.assign(document.createElement('pre'), {
        textContent: String(error.stack || error),
        style: 'color:#ef5350;padding:16px;white-space:pre-wrap',
      }));
    });
</script>
